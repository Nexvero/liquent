[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liquent"
version = "0.0.1"
description = "Liquent — understand liquidity. Modular skeleton (analysis mode only, no live execution)."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "Liquent Team" }]
# LQ-058: minimal control-plane runtime only. These packages provide HTTP,
# typed settings, and the ASGI server; no trading connectivity is included.
# LQ-161: PyJWT[crypto] and httpx2 are the verified base for the later OIDC
# verification adapter (LQ-160). Neither is used by production code yet.
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "prometheus-client>=0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "PyJWT[crypto]>=2.13,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
liquent-control-plane = "liquent_platform.transport.http.main:main"
liquent-migrate = "liquent_platform.persistence.migrate:main"
liquent-health-check = "liquent_platform.observability.external_health:main"

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "pytest>=7.0",
    "setuptools>=80,<84",
    "wheel>=0.45,<1",
]
# LQ-020: optionales Visual-Preview-Extra. KEINE Pflicht-Dependency; nur für die
# lokale Streamlit-Preview unter tools/visual_preview/. dependencies=[] bleibt.
visual = ["streamlit>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liquent_platform = [
    "persistence/alembic/*.py",
    "persistence/alembic/*.mako",
    "persistence/alembic/versions/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "postgres_integration: needs a disposable PostgreSQL server (LQ-179)",
]
