name: liquent-edge

services:
  edge:
    image: ${LIQUENT_EDGE_IMAGE:?set an immutable nginx image digest}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - /var/www/html:/var/www/html:ro
    networks:
      - public
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  public:
    external: true
    name: liquent_public
