upstream liquent_staging_control_plane {
    server control-plane:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.liquent.ai;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.liquent.ai;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; form-action 'self'; frame-ancestors 'none'; style-src 'sha256-O3Po9K48z6DEp+VhXeYJ9LNfMyG2v8OHf0Z22S6wzYw='" always;

    client_max_body_size 1m;

    location = /health/live {
        proxy_pass http://liquent_staging_control_plane/health/live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /v1/session/oidc/login {
        proxy_pass http://liquent_staging_control_plane/v1/session/oidc/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 5s;
    }

    location = /login {
        # Preserve the concrete origin for the same-origin POST form. The
        # application puts no user or business data in this URL, while the
        # later provider redirect retains its stricter no-referrer policy.
        # Declaring one add_header at location scope disables inheritance, so
        # repeat every server-level security header deliberately.
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        # CSP form-action is checked across redirects. Permit only the exact
        # configured Google authorization origin after the same-origin POST.
        add_header Content-Security-Policy "default-src 'none'; form-action 'self' https://accounts.google.com; frame-ancestors 'none'; style-src 'sha256-O3Po9K48z6DEp+VhXeYJ9LNfMyG2v8OHf0Z22S6wzYw='" always;
        proxy_pass http://liquent_staging_control_plane/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /login/rejected {
        proxy_pass http://liquent_staging_control_plane/login/rejected;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /login/unavailable {
        proxy_pass http://liquent_staging_control_plane/login/unavailable;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /v1/session/oidc/callback {
        proxy_pass http://liquent_staging_control_plane/v1/session/oidc/callback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 5s;
    }

    location = / {
        proxy_pass http://liquent_staging_control_plane/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location ~ ^/research/jobs/[A-Za-z0-9_-]+$ {
        # Only the reviewed result-page stylesheet is allowed, not arbitrary inline CSS.
        # Repeat inherited headers because location-level add_header replaces inheritance.
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-O3Po9K48z6DEp+VhXeYJ9LNfMyG2v8OHf0Z22S6wzYw='; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        proxy_pass http://liquent_staging_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /research {
        # Customer script is digest-bound; SRI and app CSP enforce the same hash.
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-pHs4GlNaAz52LWOGXbc+LzrRCzilELgEab1kUEAxZoY='; connect-src 'self'; style-src 'sha256-O3Po9K48z6DEp+VhXeYJ9LNfMyG2v8OHf0Z22S6wzYw=' 'sha256-LCVmpHHm6QX4PBnF9gyXX6qBHD5oKkiyZ73nMu949UM='; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        proxy_pass http://liquent_staging_control_plane/research;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /research/customer.js {
        proxy_pass http://liquent_staging_control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location ~ ^/v1/research/(customer-context|data-check|request-preview|customer-jobs|customer-feedback)$ {
        client_max_body_size 7m;
        proxy_pass http://liquent_staging_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
    }

    location ~ ^/v1/research/jobs/[A-Za-z0-9_-]+/evidence$ {
        proxy_pass http://liquent_staging_control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
