services:
  backup:
    image: ${LIQUENT_BACKUP_IMAGE:?set an immutable backup image digest}
    profiles: ["operations"]
    command: ["/opt/liquent/backup/backup.sh"]
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: ../backup/backup.env
        required: true
    environment:
      LIQUENT_BACKUP_CONFIG: /etc/liquent/backup.env
      RESTIC_CACHE_DIR: /tmp/restic-cache
    secrets:
      - restic_password
      - ovh_access_key
      - ovh_secret_key
      - pgpass
    networks:
      - data
      - backup-egress
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.00
    mem_limit: 1024m
    tmpfs:
      - /backup-input/database:size=2048m,mode=0700,uid=10001,gid=10001
      - /tmp:size=64m,mode=1777
    volumes:
      - ../backup/backup.env:/etc/liquent/backup.env:ro
      - artifacts:/backup-input/artifacts:ro

networks:
  backup-egress:
    internal: false

secrets:
  restic_password:
    file: ${LIQUENT_SECRETS_DIR:?set host secrets directory}/restic_password
  ovh_access_key:
    file: ${LIQUENT_SECRETS_DIR:?set host secrets directory}/ovh_access_key
  ovh_secret_key:
    file: ${LIQUENT_SECRETS_DIR:?set host secrets directory}/ovh_secret_key
  pgpass:
    file: ${LIQUENT_SECRETS_DIR:?set host secrets directory}/pgpass
