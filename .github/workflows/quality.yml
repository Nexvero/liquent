name: Quality and release artifact

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install locked build frontend
        run: python -m pip install --constraint requirements/ci.lock build==1.5.0 setuptools==80.10.2 wheel==0.47.0

      - name: Install locked test environment
        run: python -m pip install --no-build-isolation --constraint requirements/ci.lock --editable ".[dev]"

      - name: Verify dependencies
        run: python -m pip check

      - name: Verify Bash syntax
        run: find operations -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Reject whitespace errors
        run: git diff --check

  wheel:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install locked build frontend
        run: python -m pip install --constraint requirements/ci.lock build==1.5.0 setuptools==80.10.2 wheel==0.47.0

      - name: Install locked build environment
        run: python -m pip install --no-build-isolation --constraint requirements/ci.lock --editable ".[dev]"

      - name: Fix source timestamp to reviewed commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build wheel without an unpinned isolation environment
        run: python -m build --wheel --no-isolation

      - name: Verify release wheel contents and digest
        run: python tools/verify_release_wheel.py dist/liquent-*.whl

      - name: Upload verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquent-wheel-${{ github.sha }}
          path: dist/liquent-*.whl
          if-no-files-found: error
          retention-days: 14

  container:
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build immutable-base application image
        run: |
          docker build \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "liquent:${GITHUB_SHA}" .

      - name: Verify image contract
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "liquent:${GITHUB_SHA}")" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.Healthcheck.Test}}' "liquent:${GITHUB_SHA}")" != "[]"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "liquent:${GITHUB_SHA}")" = "${GITHUB_SHA}"

      - name: Run hardened container smoke test
        run: operations/container/smoke-test.sh "liquent:${GITHUB_SHA}"

      - name: Prepare supply-chain evidence directory
        run: mkdir -p dist

      - name: Generate SPDX JSON image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: liquent:${{ github.sha }}
          format: spdx-json
          output-file: dist/liquent-image.spdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify SBOM structure and Liquent identity
        run: python tools/verify_image_sbom.py dist/liquent-image.spdx.json

      - name: Fail on high or critical image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: liquent:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: dist/grype-results.json
          grype-version: v0.112.0
          cache-db: false

      - name: Summarize blocking vulnerability findings
        if: failure() && hashFiles('dist/grype-results.json') != ''
        run: |
          jq -r '
            .matches[]
            | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | select((.vulnerability.fix.versions // []) | length > 0)
            | [
                .artifact.name,
                .artifact.version,
                .vulnerability.id,
                .vulnerability.severity,
                ((.vulnerability.fix.versions // []) | join(",")),
                .vulnerability.dataSource
              ]
            | @tsv
          ' dist/grype-results.json

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquent-supply-chain-${{ github.sha }}
          path: |
            dist/liquent-image.spdx.json
            dist/grype-results.json
          if-no-files-found: warn
          retention-days: 14

  provenance:
    if: github.event_name == 'push'
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified supply-chain evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: liquent-supply-chain-${{ github.sha }}
          path: supply-chain

      - name: Attest SBOM build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: supply-chain/liquent-image.spdx.json
