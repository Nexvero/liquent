# exception-owner: Liquent Platform Architecture
# exception-expires: 2026-10-15
# exception-revalidated: 2026-08-11
#
# decision: no compatible stable patched official image is available.
#
# All three findings are NVD/CNA CPE matches against the CPython interpreter of
# the base image itself — not against a Debian package and not against a Liquent
# dependency, so no dependency change can resolve them.
#
#   CVE-2026-15308  pre-existing, carried over from the first real scan.
#   CVE-2026-11940  new, tarfile.extractall() path traversal via hardlink.
#   CVE-2026-11972  new, quadratic tarfile parsing in streaming mode.
#
# The 2026-08-11 re-evaluation found one CNA correction: CVE-2026-11940 now
# has branch-specific fixed versions (3.13.15, 3.14.7, and 3.15.0b4).
# Python 3.13.15 is not yet released. Moving to 3.14.7 would change the minor
# runtime while CVE-2026-15308 and CVE-2026-11972 still declare every CPython
# below 3.15.0b4 affected, so it would not clear this exception set.
# python:3.13.14-slim-trixie therefore remains the newest compatible stable
# 3.13 image and its digest remains pinned.
#
# Moving to the 3.15.0b4 beta interpreter remains explicitly REJECTED: a
# pre-release runtime in the production image is a larger risk than these
# findings. Python 3.15 is planned as stable on 2026-10-01; the renewed expiry
# leaves two weeks to assess its official stable image without making this
# exception indefinite.
#
# This exception is NOT a statement that the vulnerabilities are harmless. It is
# a time-boxed risk acceptance, scoped to python 3.13.14 only, and it must NOT
# be carried over to any other Python version — a base-image bump requires new,
# separately justified entries or none at all.
#
# Remove each entry as soon as a compatible stable image or a corrected,
# dependable CVE record exists. Re-evaluate on every Python base-image update
# and on every change to the CNA or NVD data for these CVEs. The regression test
# fails closed on and after the expiry date.
ignore:
  - vulnerability: CVE-2026-15308
    package:
      name: python
      version: 3.13.14
  - vulnerability: CVE-2026-11940
    package:
      name: python
      version: 3.13.14
  - vulnerability: CVE-2026-11972
    package:
      name: python
      version: 3.13.14
