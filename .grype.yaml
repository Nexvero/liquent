# exception-owner: Liquent Platform Architecture
# exception-expires: 2026-09-30
# rationale: Python 3.13.14 is the newest stable supported runtime; the only
# published fix for CVE-2026-15308 is Python 3.15.0, which is not yet a stable
# production runtime. Re-evaluate on every Python base-image update and remove
# this exception as soon as a stable supported fix exists.
ignore:
  - vulnerability: CVE-2026-15308
    package:
      name: python
      version: 3.13.14
